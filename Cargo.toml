[package]
name = "xmip-core-transport-syslog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-syslog"
description = "Syslog transport: one RFC 5424 message is one Stream, the header in the origin; UDP datagrams or TCP with octet counting. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: syslog is a text header
# and a body, over UDP or TCP through the capability's sockets, so neither
# the udp nor the tcp technology is a carrier here. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26), and the one clock
# (xcore::Clock) a header's timestamp is read from.
xcore = { workspace = true }
# The estate's encoding primitives: the civil calendar a timestamp is written from.
codec = { workspace = true, optional = true }
# A frame read under its ceiling (`net::read`, `net::MAX_BODY`), octet-counted
# or ended by a line feed.
net = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:codec", "dep:net"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
